services:
  db:
    image: postgres:17
    container_name: englishforce_db
    # restart: always
    environment:
      POSTGRES_USER: englishforce
      POSTGRES_PASSWORD: englishforce_password
      POSTGRES_DB: englishforce
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishforce -d englishforce"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: englishforce_redis
    # restart: always
    ports:
      - "6379:6379"


  backend:
    build:
      context: ./EnglishForce-backend
      dockerfile: Dockerfile
    container_name: englishforce_backend
    # restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ./EnglishForce-backend/.env
    environment:
      DB_HOST: db
      DATABASE_URL: postgres://englishforce:englishforce_password@db:5432/englishforce
      DB_USER: englishforce
      DB_PASSWORD: englishforce_password
      DB_NAME: englishforce
      USE_REDIS: true
      FASTAPI_CHATBOT_URL: http://ai:8000
    volumes:
      - ./EnglishForce-backend:/usr/src/app 
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./EnglishForce-frontend
      dockerfile: Dockerfile
      args:
        # Cho build-time (Vite/CRA dùng REACT_APP_*)
        REACT_APP_BACKEND_URL: http://localhost:5000
        REACT_APP_AI_URL: http://localhost:8000
    container_name: englishforce_frontend
    # restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file:
      - ./EnglishForce-frontend/.env
    volumes:
      - ./EnglishForce-frontend:/usr/src/app
      - /usr/src/app/node_modules

  ai:
    build:
      context: ./EnglishForce-AI/AIServer
      dockerfile: Dockerfile
    container_name: englishforce_ai
    # restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - ./EnglishForce-AI/AIServer/.env
    environment:
      DB_HOST: db
      # Thư viện SQLAlchemy (Python) chỉ chấp nhận 'postgresql://', KHÔNG chấp nhận 'postgres://' trong DATABASE_URL
      # Backend chạy bình thường vì dùng thư viện khác (Prisma/TypeORM/pg) không strict như SQLAlchemy
      DATABASE_URL: postgresql://englishforce:englishforce_password@db:5432/englishforce
      DB_USER: englishforce
      DB_PASSWORD: englishforce_password
      DB_NAME: englishforce
      
volumes:
  postgres_data:
