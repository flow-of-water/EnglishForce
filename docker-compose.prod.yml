services:
  db:
    image: postgres:15
    container_name: englishforce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: englishforce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: englishforce
    # KHÔNG publish cổng DB ra ngoài trong prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishforce -d englishforce"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: flow-of-water/englishforce-backend:1.0.0
    container_name: englishforce_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # nạp biến cần thiết (đừng mount code)
      DATABASE_URL: postgres://englishforce:${POSTGRES_PASSWORD}@db:5432/englishforce
      NODE_ENV: production
    ports:
      - "5000:5000"

  ai:
    image: flow-of-water/englishforce-ai:1.0.0
    container_name: englishforce_ai
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "8000:8000"

  frontend:
    image: flow-of-water/englishforce-frontend:1.0.0
    container_name: englishforce_frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ai
    # Frontend build-time đã bake API_URL, nên chỉ cần expose cổng
    ports:
      - "3000:3000"

volumes:
  postgres_data:
